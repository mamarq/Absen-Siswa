<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-100 text-slate-900">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#064e3b">
  <title>Koneksi Terputus - SIA & Jurnal Guru Mapel</title>
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f1f5f9;
      color: #0f172a;
      box-sizing: border-box;
    }
    .card {
      background-color: #ffffff;
      max-width: 440px;
      width: 90%;
      margin: 20px auto;
      padding: 32px 24px;
      border-radius: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
      text-align: center;
    }
    .icon-wrapper {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, #064e3b, #059669);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      box-shadow: 0 10px 15px -3px rgba(6, 78, 59, 0.3);
    }
    .icon-wrapper svg {
      width: 32px;
      height: 32px;
    }
    h2 {
      margin: 0 0 8px;
      font-size: 1.25rem;
      font-weight: 800;
      color: #0f172a;
    }
    p {
      margin: 0 0 24px;
      font-size: 0.875rem;
      line-height: 1.5;
      color: #64748b;
    }
    .btn-reload {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background-color: #059669;
      color: #ffffff;
      font-weight: 700;
      font-size: 0.875rem;
      padding: 12px 24px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      width: 100%;
      box-sizing: border-box;
      box-shadow: 0 4px 6px -1px rgba(5, 150, 105, 0.2);
      transition: all 0.2s ease;
    }
    .btn-reload:hover {
      background-color: #047857;
      transform: translateY(-1px);
    }
    .btn-reload:active {
      transform: scale(0.98);
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 9999px;
      margin-bottom: 16px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #dc2626;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="status-badge">
      <span class="status-dot"></span>
      <span>Tidak Ada Koneksi Internet</span>
    </div>

    <div class="icon-wrapper">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>

    <h2>Anda Sedang Offline</h2>
    <p>
      Sambungkan perangkat Anda ke jaringan internet (Wi-Fi atau Data Seluler) untuk mengakses dan menyinkronkan data presensi, jurnal, serta penilaian nilai siswa.
    </p>

    <button class="btn-reload" onclick="window.location.reload()">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
      </svg>
      <span>Coba Muat Ulang</span>
    </button>
  </div>

  <script>
    // Automatically reload when network reconnects
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
